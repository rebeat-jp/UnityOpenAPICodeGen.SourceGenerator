name: "CodeQL"

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "43 14 * * 2"

jobs:
  analyze:
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
